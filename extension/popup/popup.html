<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TearAway</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">✂</div>
      <div>
        <h1>TearAway</h1>
        <p class="tagline">Live widgets from any page</p>
      </div>
    </header>

    <section class="steps">
      <div class="step">
        <span class="num">1</span>
        <p>Go to any website</p>
      </div>
      <div class="step">
        <span class="num">2</span>
        <p>Hold <kbd>Alt</kbd> — purple highlight follows your cursor</p>
      </div>
      <div class="step">
        <span class="num">3</span>
        <p><strong>Click</strong> an element, or <strong>drag</strong> it off the screen edge</p>
      </div>
    </section>

    <section class="note">
      Uses <strong>Document Picture-in-Picture</strong> (Chrome 116+) for a real
      always-on-top window that stays <em>live</em> with the page.
    </section>

    <footer>
      <a href="#" id="open-demo">Open demo page</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
